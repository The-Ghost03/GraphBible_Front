server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — toutes les routes renvoient index.html pour React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long terme pour les assets compilés (noms avec hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Manifest et SW PWA — pas de cache
    location ~* \.(json|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
